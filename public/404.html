<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages publishes this repository below the owner domain, not at the domain root.
    var repoBase = '/graduation-presentation';
    // Slidev uses slide 1 as the safe landing route when GitHub Pages gives us only the project root.
    var route = window.location.pathname.slice(repoBase.length) || '/1';

    // GitHub Pages can only serve static files, so old history URLs need to become hash routes before Slidev boots.
    while (route === repoBase || route.indexOf(repoBase + '/') === 0)
      route = route.slice(repoBase.length) || '/1';

    if (route.charAt(0) !== '/')
      route = '/' + route;

    window.location.replace(window.location.origin + repoBase + '/#' + route + window.location.search);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
